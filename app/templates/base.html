<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>albertantioquia |</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2250%25%22 x=%2250%25%22 font-size=%2280%22 font-family=%22Assistant, sans-serif%22 font-weight=%22800%22 text-anchor=%22middle%22 dominant-baseline=%22central%22 fill=%22%23c9a882%22>A</text></svg>">
    <meta name="description" content="Albert Antioquia — Data Engineer & Photographer from the Philippines.">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    {% block head %}{% endblock %}
</head>

<body>
    <nav id="navbar">
        <div class="nav-top">
            <a href="/" class="nav-logo">AA</a>
            <button class="menu-toggle" aria-label="Toggle navigation"
                onclick="document.body.classList.toggle('nav-open')">
                <span></span><span></span><span></span>
            </button>
        </div>

        <div class="nav-middle">
            <ul class="nav-links">
                <li><a href="/#gallery" onclick="document.body.classList.remove('nav-open')">Photography</a></li>
                <li><a href="/#about" onclick="document.body.classList.remove('nav-open')">About</a></li>
                <li><a href="{{ url_for('main.tech') }}" onclick="document.body.classList.remove('nav-open')">Tech</a></li>
                {% if session.admin_logged_in %}
                <li><a href="{{ url_for('gallery.dashboard') }}" onclick="document.body.classList.remove('nav-open')">Dashboard</a></li>
                {% endif %}
            </ul>
        </div>

        <div class="nav-bottom">
            <a href="https://github.com/lbrtntq" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
            <a href="https://www.linkedin.com/in/albert-antioquia-ph/" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="https://www.youtube.com/@LBRTNTQ" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; {{ current_year }} Albert Antioquia</p>
            <div class="footer-icons">
                <a href="https://github.com/lbrtntq" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.linkedin.com/in/albert-antioquia-ph/" target="_blank" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="https://www.youtube.com/@LBRTNTQ" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>

</html>
