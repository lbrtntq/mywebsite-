{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <h2>Admin Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <p class="flash-{{ category }}" style="color: #ff5252; margin-bottom: 1rem;">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="{{ url_for('auth.login') }}" method="POST" class="admin-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="cta-button">Sign In</button>
        </form>
    </div>
</section>

<style>
    .admin-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group input {
        padding: 0.8rem;
        background: #1a1a1a;
        border: 1px solid #333;
        color: white;
        font-family: inherit;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--accent-color);
    }
</style>
{% endblock %}
