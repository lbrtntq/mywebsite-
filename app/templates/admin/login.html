{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="container" style="max-width: 400px; margin-top: 5rem;">
        <h2>Admin Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <p class="flash-{{ category }}" style="color: #ff5252; margin-bottom: 1rem;">{{ message }}</p>
        {% endfor %}
        {% endif %}
        {% endwith %}
        <form action="{{ url_for('auth.login') }}" method="POST" class="admin-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="cta-button">Sign In</button>
        </form>
    </div>
</section>

<style>
    .admin-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        background: white;
        padding: 2.5rem;
        border: 1px solid #eee;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .form-group label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        color: #999;
    }

    .form-group input {
        padding: 1rem;
        background: #fdfdfd;
        border: 1px solid #eee;
        color: #000;
        font-family: inherit;
        transition: 0.2s;
    }

    .form-group input:focus {
        outline: none;
        border-color: #000;
    }

    .cta-button {
        background: #000;
        color: #fff;
        padding: 1.2rem;
        border: none;
        font-family: inherit;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.2s;
    }

    .cta-button:hover {
        background: #222;
    }
</style>
{% endblock %}
