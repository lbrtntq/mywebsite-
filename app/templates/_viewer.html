<dialog class="viewer" data-viewer aria-labelledby="viewer-title">
    <div class="viewer-top">
        <span class="viewer-count" data-viewer-count></span>
        <h2 class="viewer-title" id="viewer-title" data-viewer-title></h2>
        <button class="icon-button" type="button" data-viewer-close aria-label="Close photo">
            <svg width="26" height="26"><use href="#i-close"/></svg>
        </button>
    </div>

    <div class="viewer-stage" data-viewer-stage>
        <button class="viewer-nav viewer-nav--prev" type="button" data-viewer-prev aria-label="Previous photo">
            <svg width="28" height="28" aria-hidden="true"><use href="#i-left"/></svg>
        </button>
        <button class="viewer-nav viewer-nav--next" type="button" data-viewer-next aria-label="Next photo">
            <svg width="28" height="28" aria-hidden="true"><use href="#i-right"/></svg>
        </button>
    </div>

    <div class="viewer-caption">
        <p class="viewer-meta" data-viewer-meta></p>
        <p class="viewer-desc" data-viewer-desc></p>
    </div>
</dialog>

<script type="application/json" data-photos>
{{ viewer_items | map('photo_json') | list | tojson }}
</script>
